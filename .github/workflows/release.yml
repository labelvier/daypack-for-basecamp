name: Release

on:
  release:
    types: [published]

jobs:
  build-chrome:
    name: Build & upload Chrome extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Chrome extension
        run: npm run package:chrome

      - name: Find zip file
        id: find-zip
        run: |
          ZIP=$(ls build/chrome/*.zip | head -n 1)
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $ZIP)" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-zip.outputs.path }}
